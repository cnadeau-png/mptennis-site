backend:
  name: github
  repo: cnadeau-png/mptennis-site
  branch: main
  auth_type: pkce
  app_id: Ov23liP4n9PO29PmQYKB

media_folder: "assets/uploads"
public_folder: "/assets/uploads"
site_url: https://mptennis.cnadeau.workers.dev
display_url: https://mptennis.cnadeau.workers.dev
logo_url: https://mptennis.cnadeau.workers.dev/assets/mp-letters.png

collections:
  - name: "posts"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "blog/_posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Method","Tactics","Racquet Fit","Training","Match Play","College","Junior Development","Other"] }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Author", name: "author", widget: "string", default: "Cade Nadeau" }
      - { label: "Body", name: "body", widget: "markdown" }
